<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Equipamentos - LendIT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f4f7f6; }
        .navbar-custom { background: linear-gradient(to right, #0f2027, #203a43, #2c5364); padding: 1rem 0; }
        .card-custom { border: none; border-radius: 12px; transition: transform 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .btn-custom { background-color: #2c5364; color: white; border: none; }
        .btn-custom:hover { background-color: #1a2f36; color: white; }
        .badge-status { font-size: 0.85rem; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark navbar-custom mb-5">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/dashboard}"><i class="bi bi-laptop me-2"></i>LendIT</a>
        <div class="d-flex align-items-center">
            <a th:href="@{/dashboard}" class="btn btn-outline-light btn-sm"><i class="bi bi-arrow-left"></i> Voltar ao Dashboard</a>
        </div>
    </div>
</nav>

<div class="container mb-5">
    
    <div th:if="${mensagemErro}" class="alert alert-danger alert-dismissible fade show mb-4" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${mensagemErro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="row mb-4 align-items-center">
        <div class="col">
            <h3 class="fw-bold" style="color: #2c5364;">Meus Equipamentos</h3>
            <p class="text-secondary mb-0">Itens que estão atualmente sob sua responsabilidade.</p>
        </div>
    </div>

    <!-- Caso não tenha equipamentos -->
    <div th:if="${#lists.isEmpty(emprestimos)}" class="alert alert-info text-center py-5">
        <i class="bi bi-emoji-smile display-4 text-secondary d-block mb-3"></i>
        <h5>Você não possui empréstimos ativos.</h5>
        <p class="mb-0 text-secondary">Vá ao <a th:href="@{/catalogo}" class="alert-link">catálogo</a> se precisar de algo!</p>
    </div>

    <!-- Tabela ou Cards de Empréstimos -->
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
        <div class="col" th:each="emp : ${emprestimos}">
            <div class="card card-custom h-100">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start mb-3">
                        <span class="badge bg-primary badge-status py-2 px-3">
                            <i class="bi bi-person-workspace me-1"></i> Em Uso
                        </span>
                        <i class="bi bi-pc-display text-secondary fs-4"></i>
                    </div>
                    
                    <h5 class="card-title fw-bold text-dark mb-1" th:text="${emp.equipamento.modelo}">Modelo</h5>
                    <p class="card-text text-muted small mb-3">
                        Patrimônio: <strong th:text="${emp.equipamento.patrimonio}">123</strong>
                    </p>
                    
                    <div class="bg-light p-2 rounded mb-4">
                        <small class="text-secondary d-block">Data de Retirada:</small>
                        <span class="fw-medium" th:text="${#temporals.format(emp.dataRetirada, 'dd/MM/yyyy')}"></span>
                        
                        <hr class="my-2">
                        
                        <small class="text-secondary d-block">Prazo de Devolução:</small>
                        <span class="fw-bold text-danger" th:text="${#temporals.format(emp.dataDevolucaoPrevista, 'dd/MM/yyyy')}"></span>
                    </div>

                    <!-- Botão de Devolução -->
                    <form th:action="@{/emprestimo/devolver/{id}(id=${emp.id})}" method="post">
                        <button type="submit" class="btn btn-outline-danger w-100 mt-auto" onclick="return confirm('Tem certeza que deseja devolver este equipamento agora?');">
                            <i class="bi bi-arrow-return-left me-1"></i> Devolver Equipamento
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
