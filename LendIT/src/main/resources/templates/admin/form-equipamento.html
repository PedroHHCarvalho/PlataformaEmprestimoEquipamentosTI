<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Equipamento - LendIT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f4f7f6; }
        .navbar-custom { background: linear-gradient(to right, #0f2027, #203a43, #2c5364); padding: 1rem 0; }
        .card-custom { border: none; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .btn-custom { background-color: #2c5364; color: white; border: none; border-radius: 8px; }
        .btn-custom:hover { background-color: #1a2f36; color: white; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark navbar-custom mb-5">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/dashboard}"><i class="bi bi-laptop me-2"></i>LendIT</a>
        <a th:href="@{/dashboard}" class="btn btn-outline-light btn-sm"><i class="bi bi-arrow-left"></i> Voltar ao Dashboard</a>
    </div>
</nav>

<div class="container mb-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card card-custom p-4">
                <h4 class="fw-bold mb-4" style="color: #2c5364;">Cadastrar Equipamento</h4>
                
                <div th:if="${mensagemSucesso}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <span th:text="${mensagemSucesso}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <!-- Se não houver categorias, mostramos um aviso -->
                <div th:if="${#lists.isEmpty(categorias)}" class="alert alert-warning">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i> 
                    Você precisa cadastrar pelo menos uma <strong>Categoria</strong> antes de adicionar um Equipamento.
                    <a th:href="@{/admin/categorias/novo}" class="alert-link ms-2">Cadastrar Categoria</a>
                </div>

                <form th:if="${!#lists.isEmpty(categorias)}" th:action="@{/admin/equipamentos}" th:object="${equipamento}" method="post">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold text-secondary">Nº Patrimônio / Tag</label>
                            <input type="text" class="form-control" th:field="*{patrimonio}" required placeholder="Ex: NTB-001">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold text-secondary">Modelo</label>
                            <input type="text" class="form-control" th:field="*{modelo}" required placeholder="Ex: Dell Latitude 5420">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold text-secondary">Categoria</label>
                            <select class="form-select" th:field="*{categoria.id}" required>
                                <option value="" disabled selected>Selecione uma categoria...</option>
                                <option th:each="cat : ${categorias}" th:value="${cat.id}" th:text="${cat.nome}"></option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-4">
                            <label class="form-label fw-bold text-secondary">Status Inicial</label>
                            <select class="form-select" th:field="*{status}" required>
                                <option th:each="st : ${statusList}" th:value="${st}" th:text="${st}"></option>
                            </select>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-custom w-100 py-2">Salvar Equipamento</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
