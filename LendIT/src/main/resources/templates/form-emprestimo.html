<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitar Empréstimo - LendIT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f4f7f6; }
        .navbar-custom { background: linear-gradient(to right, #0f2027, #203a43, #2c5364); padding: 1rem 0; }
        .card-custom { border: none; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .btn-custom { background-color: #2c5364; color: white; border: none; border-radius: 8px; }
        .btn-custom:hover { background-color: #1a2f36; color: white; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark navbar-custom mb-5">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/dashboard}"><i class="bi bi-laptop me-2"></i>LendIT</a>
        <a th:href="@{/catalogo}" class="btn btn-outline-light btn-sm"><i class="bi bi-arrow-left"></i> Voltar ao Catálogo</a>
    </div>
</nav>

<div class="container mb-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card card-custom p-4">
                <h4 class="fw-bold mb-4 text-center" style="color: #2c5364;">Confirmar Empréstimo</h4>
                
                <div th:if="${mensagemErro}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <span th:text="${mensagemErro}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <div class="bg-light p-3 rounded mb-4 text-center">
                    <i class="bi bi-pc-display fs-1 text-secondary mb-2"></i>
                    <h5 class="fw-bold mb-1" th:text="${equipamento.modelo}">Modelo</h5>
                    <p class="text-muted mb-0">Patrimônio: <strong th:text="${equipamento.patrimonio}">123</strong></p>
                    <span class="badge bg-secondary mt-2" th:text="${equipamento.categoria.nome}">Categoria</span>
                </div>

                <form th:action="@{/emprestimo/salvar}" method="post">
                    <input type="hidden" name="equipamentoId" th:value="${equipamento.id}">
                    
                    <div class="mb-4">
                        <label class="form-label fw-bold text-secondary">Data Prevista de Devolução</label>
                        <input type="date" class="form-control" name="dataDevolucaoPrevista" th:value="${dataPrevista}" required>
                        <div class="form-text">Por padrão, sugerimos o empréstimo por 7 dias. Ajuste se necessário.</div>
                    </div>

                    <button type="submit" class="btn btn-custom w-100 py-2">
                        <i class="bi bi-check-circle me-1"></i> Confirmar Solicitação
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
