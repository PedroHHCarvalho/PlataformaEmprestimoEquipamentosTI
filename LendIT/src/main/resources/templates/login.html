<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Empréstimos de TI</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>

<div class="login-card">
    <div class="login-header">
        <i class="bi bi-laptop icon-ti"></i>
        <h2>LendIT</h2>
        <p>Plataforma de Empréstimos de Equipamentos de TI</p>
    </div>

    <div th:if="${param.error}" class="alert alert-danger text-center small">Matrícula ou senha incorretos!</div>
    <div th:if="${param.logout}" class="alert alert-success text-center small">Você saiu do sistema.</div>
    <div th:if="${param.cadastrado}" class="alert alert-primary text-center small">Cadastro realizado! Faça login.</div>

    <form th:action="@{/login}" method="POST">

        <div class="mb-3">
            <label for="username" class="form-label text-secondary small fw-bold">Matrícula</label>
            <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-secondary"></i></span>
                <input type="text" class="form-control border-start-0 ps-0" id="username" name="username" placeholder="Digite sua matrícula" required>
            </div>
        </div>

        <div class="mb-4">
            <label for="password" class="form-label text-secondary small fw-bold">Senha</label>
            <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-secondary"></i></span>
                <input type="password" class="form-control border-start-0 border-end-0 ps-0" id="password" name="password" placeholder="••••••••" required>
                <span class="input-group-text border-start-0" onclick="togglePassword()" style="cursor: pointer;">
                        <i class="bi bi-eye-slash" id="toggleIcon"></i>
                    </span>
            </div>
        </div>

        <button type="submit" class="btn btn-primary btn-login w-100 mb-3">Entrar no Sistema</button>

        <div class="text-center mt-3">
            <span class="text-secondary small">Ainda não tem acesso? </span>
            <a href="/cadastro" class="text-decoration-none fw-bold" style="color: #2c5364;">Cadastre-se</a>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script th:src="@{/js/login.js}"></script>


</body>
</html>
