<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Empréstimos de TI</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>

<div class="login-card">
    <div class="login-header">
        <i class="bi bi-laptop icon-ti"></i>
        <h2>LendIT</h2>
        <p>Plataforma de Empréstimos de Equipamentos de TI</p>
    </div>

    <form class="needs-validation" novalidate onsubmit="return handleLogin(event)">

        <div class="mb-3">
            <label for="matricula" class="form-label text-secondary small fw-bold">Matrícula ou E-mail</label>
            <div class="input-group">
                    <span class="input-group-text bg-light border-end-0">
                        <i class="bi bi-person text-secondary"></i>
                    </span>
                <input type="text" class="form-control border-start-0 ps-0" id="matricula" placeholder="Digite seu acesso" required>
                <div class="invalid-feedback">Por favor, insira sua matrícula.</div>
            </div>
        </div>

        <div class="mb-4">
            <label for="senha" class="form-label text-secondary small fw-bold">Senha</label>
            <div class="input-group">
                    <span class="input-group-text bg-light border-end-0">
                        <i class="bi bi-lock text-secondary"></i>
                    </span>
                <input type="password" class="form-control border-start-0 border-end-0 ps-0" id="senha" placeholder="••••••••" required>
                <span class="input-group-text border-start-0" onclick="togglePassword()">
                        <i class="bi bi-eye-slash" id="toggleIcon"></i>
                    </span>
                <div class="invalid-feedback">Por favor, insira sua senha.</div>
            </div>
        </div>

        <button type="submit" class="btn btn-primary btn-login w-100 mb-3">
            Entrar no Sistema
        </button>

        <div class="text-center">
            <a href="#" class="text-decoration-none text-secondary small">Esqueceu a senha?</a>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script th:src="@{/js/login.js}"></script>


</body>
</html>
