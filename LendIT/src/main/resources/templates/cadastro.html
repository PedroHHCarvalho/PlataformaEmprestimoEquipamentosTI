<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Cadastro - Empréstimos de TI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
<div class="login-card">
  <div class="login-header">
    <h2>Novo Cadastro</h2>
    <p>Preencha os dados para acessar</p>
  </div>

  <form th:action="@{/cadastro}" method="POST">
    <div class="mb-3">
      <label class="form-label text-secondary small fw-bold">Nome Completo</label>
      <input type="text" class="form-control" name="nome" required>
    </div>

    <div class="mb-3">
      <label class="form-label text-secondary small fw-bold">Matrícula (Seu usuário de login)</label>
      <input type="text" class="form-control" name="matricula" required>
    </div>

    <div class="mb-3">
      <label class="form-label text-secondary small fw-bold">E-mail</label>
      <input type="email" class="form-control" name="email" required>
    </div>

    <div class="mb-4">
      <label class="form-label text-secondary small fw-bold">Senha Segura</label>
      <input type="password" class="form-control" name="senha" required>
    </div>

    <button type="submit" class="btn btn-primary btn-login w-100">Criar Conta</button>

    <div class="text-center mt-3">
      <a href="/login" class="text-decoration-none text-secondary small">Voltar para o Login</a>
    </div>
  </form>
</div>
</body>
</html>
